# 追加到服务器 nginx.conf 的 http { ... } 内（与 shop / texas 同级）
# 证书：printer.wishufree.com_bundle.crt / printer.wishufree.com.key
# 代理：localhost:7503（含 /socket.io WebSocket）

server {
    listen 443 ssl;
    server_name printer.wishufree.com;
    ssl_certificate printer.wishufree.com_bundle.crt;
    ssl_certificate_key printer.wishufree.com.key;
    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
    ssl_prefer_server_ciphers on;

    # Socket.IO（桌面端 /desk 实时推送）
    location /socket.io {
        proxy_pass http://localhost:7503/socket.io;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE';
        add_header 'Access-Control-Allow-Headers' 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization';

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://localhost:7503;
    }
}

server {
    listen 80;
    server_name printer.wishufree.com;
    return 301 https://$host$request_uri;
}
