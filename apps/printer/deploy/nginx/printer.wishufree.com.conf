# printer.wishufree.com → 127.0.0.1:7503
# 安装示例：
#   sudo cp apps/printer/deploy/nginx/printer.wishufree.com.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/printer.wishufree.com.conf /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d printer.wishufree.com   # 若尚未签证书，可先只用下方 HTTP server
#   sudo nginx -t && sudo systemctl reload nginx
#
# 宝塔：网站 → 添加站点 printer.wishufree.com → 反向代理到 http://127.0.0.1:7503
#       并开启 WebSocket，上传限制 ≥ 50MB；或粘贴本文件内容到「配置文件」。

upstream printer_backend {
    server 127.0.0.1:7503;
    keepalive 32;
}

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name printer.wishufree.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name printer.wishufree.com;

    # certbot 签发后路径；宝塔请改成面板里的证书路径
    ssl_certificate     /etc/letsencrypt/live/printer.wishufree.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/printer.wishufree.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    # H5 / API 上传（与 UPLOAD_MAX_FILE_SIZE_MB=50 对齐，略放宽）
    client_max_body_size 60m;

    # 静态可走后端 koa-static；如需直接指 public 可另加 alias
    location / {
        proxy_pass http://printer_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Socket.IO（桌面端 /desk）
    location /socket.io/ {
        proxy_pass http://printer_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
