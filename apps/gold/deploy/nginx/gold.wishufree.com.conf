# 追加到服务器 nginx.conf 的 http { ... } 内（与 shop / texas / printer 同级）
# 证书：gold.wishufree.com_bundle.crt / gold.wishufree.com.key
# 代理：localhost:7504

server {
    listen 443 ssl;
    server_name gold.wishufree.com;
    ssl_certificate gold.wishufree.com_bundle.crt;
    ssl_certificate_key gold.wishufree.com.key;
    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
    ssl_prefer_server_ciphers on;

    client_max_body_size 2m;

    location / {
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
        add_header 'Access-Control-Allow-Headers' 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization,X-Gold-Token';

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://localhost:7504;
    }
}

server {
    listen 80;
    server_name gold.wishufree.com;
    return 301 https://$host$request_uri;
}
